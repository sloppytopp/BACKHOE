name: mirror to gitlab

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to GitLab
        run: |
          git push "https://oauth2:${GITLAB_TOKEN}@gitlab.com/S1gM4/BACKHOE.git" HEAD:main
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
