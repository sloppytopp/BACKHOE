name: publish

# Runs when a GitHub Release is published (tag it, then "Publish release"
# in the GitHub UI or `gh release create`). Publishes the built package to
# PyPI and the Docker image to Docker Hub.
#
# One-time setup needed before this workflow can actually publish anything
# (same pattern as mirror-gitlab.yml's GITLAB_TOKEN — see CLAUDE.md):
#
#   PyPI: no repo secret needed. Uses PyPI's "Trusted Publisher" OIDC flow
#   instead of a stored API token — add this repo as a trusted publisher
#   at https://pypi.org/manage/project/backhoe-osint/settings/publishing/
#   (workflow filename: publish.yml, environment: pypi). If the project
#   doesn't exist on PyPI yet, the first publish has to be done manually
#   once (`python -m build && twine upload dist/*`) to claim the name,
#   after which trusted publishing takes over for every release after.
#
#   Docker Hub: needs two repo secrets — Settings > Secrets and variables
#   > Actions > New repository secret:
#     DOCKERHUB_USERNAME  — your Docker Hub username
#     DOCKERHUB_TOKEN     — a Docker Hub access token (not your password;
#                            create one at hub.docker.com > Account Settings
#                            > Security > New Access Token)
#   If these aren't set, the docker job below fails loudly rather than
#   silently skipping — same "fail loud, never fake" rule as the rest of
#   this project's own code, applied to its own CI.

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backhoe:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backhoe:${{ github.event.release.tag_name }}
